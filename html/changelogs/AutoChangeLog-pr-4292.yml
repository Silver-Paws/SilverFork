  - bugfix: Сохранение истории чата больше не подвешивает клиент.
  - admin: Таблица пинга по всем игрокам в окне диагностики.
  - code_imp: 'Логи пинга: ping-clients, ping-events, ping-host, ping-samples, ping-summary.'
