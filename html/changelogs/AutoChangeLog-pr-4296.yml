  - tweak: Атмосфера оседает ещё в лобби, а не после спавна экипажа.
  - tweak: Старый BYOND в диагностике пинга - теперь совет, а не причина пинга.
  - map: 'Космические руины без планетарного воздуха: тёплые комнаты в Atmo Asteroid
