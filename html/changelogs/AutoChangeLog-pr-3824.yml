author: Herobrine998
delete-after: true
changes:
  - rscadd: В технологию БС бикеров добавлены БС-гипоампулы, вмещающие в два раза
      больше реагента, чем обычные
  - rscadd: Для варки трикордразина теперь требуется нагрев до 480
  - balance: Все гипоспреи немного ускорены
  - qol: Переспрайчены гипоспреи, добавлены оверлеи с количеством и цветом реагента
      внутри
  - qol: Добавлена «тактикульная» смена ампул во всех гипоспреях - клик по гипоспрею
      с ампулой меняет их местами
  - qol: Если гипоампула находится в коробке для ампул или мед. поясе, можно заменить
      ее в гипоспрее, просто нажам им на ампулу
  - qol: В гипоампулы теперь можно напрямую заливать жидкости без использования шприца
      (вылить жидкость всё ещё нельзя)
  - qol: В гипоспрей с установленной ампулой теперь можно напрямую заливать жидкость,
      не вытаскивая её
  - qol: Добавлены контекстные подсказки и описания для гипоспреев
  - qol: Для гипоампул теперь можно устанавливать размер впрыска вплоть до их максимального
      объёма
  - qol: 'Все наборы в наномедах заменены на обычные синие. В них теперь находятся
      по две ампулы из старых наборов, а также ампулы с готовыми смесями: бикардином,
      келотаном, антитоксином и трикордразином'
  - qol: Медики теперь спавнятся с новыми наборами, набор СМО также обновлены
