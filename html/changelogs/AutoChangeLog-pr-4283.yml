author: DuLL-FoX
delete-after: true
changes:
  - bugfix: портальные трусики и другие надетые вещи, VR-аватары и призраки после
      лобби больше не вызывают лаги при удалении
  - bugfix: маяк руины, точка стыковки и кнопки суперкруиза больше не застревают в
      памяти после полёта
  - bugfix: импланты вроде дыхательной трубки больше не пропадают с тела и не залипают
      на нём
  - bugfix: тело при обычном пулле больше не налезает на тянущего
  - tweak: дата-худы призрака выключены по умолчанию, включение запоминается (вкладка
      Ghost или настройки призрака)
