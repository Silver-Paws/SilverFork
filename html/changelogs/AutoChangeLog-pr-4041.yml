author: Silver-Paws
delete-after: true
changes:
  - rscadd: Отстранённый теперь имеет 10% шанс ударить подножкой, помимо выкручивания
      руки. Подножка по лежачей цели приведёт к удару по голове.
  - rscadd: Отстранённый теперь имеет 33% выкрутить конечность с концами, если цель
      имеет модульные конечности.
  - balance: Отстранённый теперь не сможет выкручивать руки, а также не будет давать
      подножку, если у него нет рук или ног или он недееспособен (Связан, спит, в
      стане, т.д.).
